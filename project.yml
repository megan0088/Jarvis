name: DinoPocket

options:
  bundleIdPrefix: com.Jarvis
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.2"
  groupSortPosition: top

settings:
  base:
    # Wave 2. Migrasi 5.0 -> 6.0 hanya menghasilkan SATU pelanggaran di seluruh
    # basis kode (UNNotification bukan Sendable, di WellnessNotificationCenter).
    # SWIFT_APPROACHABLE_CONCURRENCY yang sudah aktif sejak awal terbukti
    # meredamnya, persis dugaan spec §12.
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    DEVELOPMENT_TEAM: R93K2HFM78
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  DinoPocketMac:
    type: application
    platform: macOS
    sources:
      - path: SharedCore
      - path: DinoPocketMac
        excludes:
          - "Presentation/Views/ContentView.swift"
          - "Presentation/Views/ContentView+iOS.swift"
          # Extension dari ContentView (UI retro), bukan file produk macOS —
          # jalur macOS memakai DashboardTemplate. Ikut dibekukan.
          - "Presentation/Views/ContentView+macOS.swift"
          - "Presentation/Views/PetActivityWidgets.swift"
          - "Infrastructure/Services/Haptics.swift"
          # Karakter SpriteKit 2D, dikarantina — lihat DinoPocketMac/Legacy/README.md
          - "Legacy/**"
          - "DinoPocketMac.entitlements"
          - "DinoPocket.entitlements"
    settings:
      base:
        # PRODUCT_NAME sengaja TIDAK disetel: XcodeGen menurunkan TEST_HOST dari
        # nama target, sehingga PRODUCT_NAME yang berbeda membuat bundle test host
        # tidak ketemu. Nama produk mengikuti nama target selama Wave 0 dan ikut
        # daftar rename terpusat (spec §14).
        #
        # Nama modul SENGAJA dipertahankan sebagai Jarvis sepanjang Wave 0.
        # Keenam file test memakai `@testable import Jarvis`; mengubah nama modul
        # akan mematahkan 28 test sekaligus — justru jaring pengaman yang dipakai
        # setiap task — dan membuat Jarvis.xcodeproj lama tidak bisa lagi
        # mengompilasi test-nya, sehingga properti "dua project sama-sama hijau"
        # yang menjadi jalan mundur ikut hilang.
        # Nama modul masuk daftar rename terpusat (spec §14), bukan Wave 0.
        PRODUCT_MODULE_NAME: Jarvis
        PRODUCT_BUNDLE_IDENTIFIER: com.Jarvis.Ega
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Kategori App Store. Health & Fitness dipilih karena inti produknya
        # ritme sehat (minum, stretch, istirahat), bukan produktivitas.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_USER_SELECTED_FILES: readwrite
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Entitlement Sign in with Apple HANYA di Release.
        #
        # Menyertakannya di Debug memaksa provisioning profile bercapability SIWA,
        # dan tanpa itu build gagal total ("No profiles for 'com.Jarvis.Ega' were
        # found") sehingga app tidak bisa dijalankan sama sekali selama setup akun
        # developer belum tuntas. Debug memakai skip berlabel jelas di onboarding.
        #
        # PRASYARAT SEBELUM RELEASE BISA DI-BUILD:
        #   1. Daftarkan Mac ini di developer account (Xcode > Settings > Accounts)
        #   2. Aktifkan capability "Sign In with Apple" untuk App ID com.Jarvis.Ega
        #      di developer.apple.com > Identifiers
        #   3. Build dengan -allowProvisioningUpdates
        Release:
          CODE_SIGN_ENTITLEMENTS: DinoPocketMac/DinoPocketMac.entitlements

  DinoPocketTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DinoPocketTests
    dependencies:
      - target: DinoPocketMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DinoPocketMac:
    build:
      targets:
        DinoPocketMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DinoPocketTests
    archive:
      config: Release
