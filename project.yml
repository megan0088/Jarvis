name: DinoPocket

options:
  bundleIdPrefix: com.ega
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.2"
  groupSortPosition: top

settings:
  base:
    # Wave 2. Migrasi 5.0 -> 6.0 hanya menghasilkan SATU pelanggaran di seluruh
    # basis kode (UNNotification bukan Sendable, di WellnessNotificationCenter).
    # SWIFT_APPROACHABLE_CONCURRENCY yang sudah aktif sejak awal terbukti
    # meredamnya, persis dugaan spec §12.
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    DEVELOPMENT_TEAM: R93K2HFM78
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  DinoPocketMac:
    type: application
    platform: macOS
    sources:
      - path: SharedCore
      - path: DinoPocketMac
        excludes:
          - "Presentation/Views/ContentView.swift"
          - "Presentation/Views/ContentView+iOS.swift"
          # Extension dari ContentView (UI retro), bukan file produk macOS —
          # jalur macOS memakai DashboardTemplate. Ikut dibekukan.
          - "Presentation/Views/ContentView+macOS.swift"
          - "Presentation/Views/PetActivityWidgets.swift"
          - "Infrastructure/Services/Haptics.swift"
          # Karakter SpriteKit 2D, dikarantina — lihat DinoPocketMac/Legacy/README.md
          - "Legacy/**"
          # PNG icon iOS lepas, tidak dirujuk kode mana pun, tapi ikut tersalin
          # ~1,2 MB ke dalam bundle karena `sources:` menyapu seluruh folder.
          - "images/**"
          - "DinoPocket.entitlements"
    settings:
      base:
        # Nama produk final (spec §14). Bundle jadi Apl.app dan CFBundleName jadi
        # Apl — GENERATE_INFOPLIST_FILE memaku CFBundleName ke $(PRODUCT_NAME),
        # jadi INFOPLIST_KEY_CFBundleName tidak berpengaruh dan PRODUCT_NAME
        # inilah satu-satunya jalannya.
        #
        # KONSEKUENSI: XcodeGen menurunkan TEST_HOST dari nama TARGET, bukan dari
        # PRODUCT_NAME. Begitu keduanya berbeda, TEST_HOST bawaan menunjuk bundle
        # yang tidak ada dan seluruh test gagal dimuat — karena itu ia disetel
        # eksplisit di target DinoPocketTests di bawah.
        PRODUCT_NAME: Apl
        #
        # Nama modul ikut rename terpusat (spec §14). Alasan menahannya di Wave 0
        # — menjaga Jarvis.xcodeproj lama tetap bisa mengompilasi test sebagai
        # jalan mundur — sudah gugur sejak project itu dipensiunkan di Task 8.
        PRODUCT_MODULE_NAME: Apl
        PRODUCT_BUNDLE_IDENTIFIER: com.ega.apl
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Aksen merek (spec B §7). Toggle, focus ring, dan tombol default ikut
        # teal tanpa kode tambahan — kecuali pengguna memilih accent sendiri di
        # System Settings, yang memang harus dihormati kontrol sistem.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Apl
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Muhamad Ega Nugraha. All rights reserved."
        # Tanpa kunci ini App Store Connect menanyakan kepatuhan ekspor
        # enkripsi di SETIAP submit. App ini tidak memakai kriptografi di
        # luar yang disediakan sistem (Keychain), jadi jawabannya NO.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Kategori App Store. Health & Fitness dipilih karena inti produknya
        # ritme sehat (minum, stretch, istirahat), bukan produktivitas.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_USER_SELECTED_FILES: readwrite
        COMBINE_HIDPI_IMAGES: YES

  DinoPocketTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DinoPocketTests
    dependencies:
      - target: DinoPocketMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Wajib eksplisit: PRODUCT_NAME app (Apl) berbeda dari nama targetnya
        # (DinoPocketMac), dan TEST_HOST bawaan XcodeGen memakai nama target.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Apl.app/Contents/MacOS/Apl"

schemes:
  DinoPocketMac:
    build:
      targets:
        DinoPocketMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DinoPocketTests
    archive:
      config: Release
